name: Incremental Publish
on:
  schedule: [ { cron: "0 */3 * * *" } ]  # every 3 hours
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Lookback window in hours (manual re-publish; default 24)"
        default: "24"
      allow_llm:
        description: "Process uncached events with the LLM (true/false)"
        default: "true"
jobs:
  inc:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
      LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
      INCREMENTAL_ALLOW_LLM: ${{ github.event.inputs.allow_llm || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v4
        with: { version: 8 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run inc
